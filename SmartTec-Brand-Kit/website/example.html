<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTec — particle logo</title><link rel="stylesheet" href="./smarttec-particles.css"><style>body{margin:0;background:#0c241b;color:#eef1ef;font:15px Arial,sans-serif}main{max-width:1200px;margin:36px auto;padding:0 20px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:12px 18px;border:1px solid #7be88a66;background:#1c4839;color:#eef1ef;border-radius:5px;cursor:pointer}button:first-child{background:#7be88a;color:#10251a}p{color:#bbd6c4}</style></head><body><main><div id="smarttec-logo" class="smarttec-particle-stage"></div><nav><button id="replay">Replay formation</button><button id="pause">Pause</button><button id="intensity">Conference mode</button></nav><p id="status" role="status">Loading logo…</p></main><script type="module">
import {mountSmartTec} from './smarttec-particles.mjs';
try{const animation=await mountSmartTec(document.getElementById('smarttec-logo'));let paused=false,conference=false;document.getElementById('status').textContent='Ready — responsive animation with reduced-motion support.';document.getElementById('replay').onclick=()=>{animation.replay();paused=false;document.getElementById('pause').textContent='Pause';};document.getElementById('pause').onclick=e=>{paused=!paused;paused?animation.pause():animation.play();e.target.textContent=paused?'Play':'Pause';};document.getElementById('intensity').onclick=e=>{conference=!conference;animation.setIntensity(conference?'conference':'website');e.target.textContent=conference?'Website mode':'Conference mode';};window.addEventListener('pagehide',()=>animation.destroy(),{once:true});}catch(e){document.getElementById('status').textContent='Serve this folder over HTTP to load the animation modules. The self-contained preview in ../previews works directly from disk.';console.error(e);}
</script></body></html>
