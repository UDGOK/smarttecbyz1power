<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc"><title id="title">SmartTec two-loop cooling design intent</title><desc id="desc">Separate warm and chilled facility loops. Supply flows toward the racks; warmer return flows toward outdoor equipment. CDU isolates the server circuit. Equipment and locations pending mechanical review.</desc><rect width="1100" height="820" rx="20" fill="#12362b"/><style>text{font-family:Arial,sans-serif;fill:#eef1ef}.small{font-size:14px}.label{font-size:18px;font-weight:bold}.title{font-size:34px;font-weight:bold}.note{fill:#bed6c8;font-size:16px}</style><text x="40" y="48" class="small" style="fill:#7be88a">SMARTTEC / THERMAL ARCHITECTURE / DESIGN INTENT</text><text x="40" y="100" class="title">Two circuits. Different cooling duties.</text><text x="40" y="170" class="label" style="fill:#efb99c">LOOP A · WARM WATER</text><rect x="40" y="193" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="55" y="233" class="label">LIQUID-COOLED RACKS</text><text x="55" y="267" class="small">OEM-compatible server fluid</text><rect x="385" y="193" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="400" y="233" class="label">CDU ISOLATION</text><text x="400" y="267" class="small">Server / facility separation</text><rect x="730" y="193" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="745" y="233" class="label">DRY COOLERS + TRIM</text><text x="745" y="267" class="small">Non-evaporative heat rejection</text><path d="M950 325H130" fill="none" stroke="#efb99c" stroke-width="3"/><path d="M130 325l12 -7v14Z" fill="#efb99c"/><text x="400" y="319" class="small">SUPPLY TO LOAD</text><path d="M130 372H950" fill="none" stroke="#c6b6e9" stroke-width="3"/><path d="M950 372l-12 -7v14Z" fill="#c6b6e9"/><text x="385" y="398" class="small">WARMER RETURN TO PLANT</text><path d="M700 193v205" stroke="#91a59a" stroke-dasharray="6 5"/><text x="718" y="420" class="small">BUILDING / OUTDOOR BOUNDARY</text><text x="40" y="450" class="label" style="fill:#bce9eb">LOOP B · CHILLED WATER</text><rect x="40" y="473" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="55" y="513" class="label">ACTIVE REAR DOORS</text><text x="55" y="547" class="small">Rack exhaust heat capture</text><rect x="385" y="473" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="400" y="513" class="label">BUFFER + PUMPS</text><text x="400" y="547" class="small">Transition support; not sized</text><rect x="730" y="473" width="300" height="100" rx="6" fill="#09291d" stroke="#88a797" stroke-dasharray="5 5"/><text x="745" y="513" class="label">SCROLL CHILLERS</text><text x="745" y="547" class="small">Air-cooled heat rejection</text><path d="M950 605H130" fill="none" stroke="#bce9eb" stroke-width="3"/><path d="M130 605l12 -7v14Z" fill="#bce9eb"/><text x="400" y="599" class="small">SUPPLY TO LOAD</text><path d="M130 652H950" fill="none" stroke="#85bfee" stroke-width="3"/><path d="M950 652l-12 -7v14Z" fill="#85bfee"/><text x="385" y="678" class="small">WARMER RETURN TO PLANT</text><path d="M700 473v205" stroke="#91a59a" stroke-dasharray="6 5"/><text x="718" y="700" class="small">BUILDING / OUTDOOR BOUNDARY</text><text x="40" y="757" class="note">Closed-circuit design goal. No evaporative water use during normal heat rejection.</text><text x="40" y="787" class="note">Filling and maintenance still require fluid. Siting, capacity and N+1 verification are pending.</text></svg>